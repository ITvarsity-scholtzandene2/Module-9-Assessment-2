<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>FoodieFanatix</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/custom.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <a href="#" class="navbar-brand">Foodie<span class="text-muted">Fanatix</span></a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbar">
                <div class="navbar-nav">
                    <a href="index.html" class="nav-item nav-link">Home</a>
                    <a href="contact.html" class="nav-item nav-link">Contact</a>
                </div>
            </div>
        </nav>
    </header>

    <main>

        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="images/food_5.webp" class="d-block w-100">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Think your food deserves a review?</h5>
                    <p>Fill in the form below and I’ll bring my fork!</p>
                </div>
            </div>
        </div>

        <form class="form">
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="inputEmail4">Email</label>
                    <input type="email" class="form-control" id="inputEmail4">
                </div>
                <div class="form-group col-md-6">
                    <label for="Name">Name of restaurant</label>
                    <input type="text" class="form-control" id="inputPassword4">
                </div>
            </div>
            <div class="form-group">
                <label for="inputAddress">Address</label>
                <input type="text" class="form-control" id="inputAddress" placeholder="1234 Main St">
            </div>
            <div class="form-group">
                <label for="inputAddress2">Address 2</label>
                <input type="text" class="form-control" id="inputAddress2" placeholder="Apartment, studio, or floor">
            </div>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="inputCity">City</label>
                    <input type="text" class="form-control" id="inputCity" placeholder="Plettenbergbay">
                </div>
                <div class="form-group col-md-4">
                    <label for="inputState">State</label>
                    <input type="text" class="form-control" id="inputCity" placeholder="Western Cape">
                </div>
                <div class="form-group col-md-2">
                    <label for="inputZip">Zip</label>
                    <input type="text" class="form-control" id="inputZip" placeholder="6620">
                </div>
            </div>

            <a href="thanks.html" class="btn btn-dark btn-lg active" role="button" aria-pressed="true">Come check us
                out</a>

            <hr class="section-divider" />
            <footer class="container footer-section">
                <p class="float-right"><a class="text-decoration-none text-dark" href="#">Back to top</a></p>
                <p>&copy; 2017-2026 Company, Inc. &middot; <a class="text-decoration-none text-dark"
                        href="#">Privacy</a>
                    &middot; <a class="text-decoration-none text-dark" href="#">Terms</a></p>
            </footer>
    </main>
    <script src="js/jquery-3.7.1.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
